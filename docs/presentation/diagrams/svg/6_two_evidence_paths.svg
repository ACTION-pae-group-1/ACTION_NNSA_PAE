<path d="M 1430 792 L 1430 868" fill="none" stroke="#4B5563" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<path d="M 810 761 L 1110 561" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" stroke-dasharray="12 9"/>
<rect x="854.5" y="647.3" width="211.0" height="33.800000000000004" rx="6" fill="#F7F8FA" stroke="none"/>
<text x="960" y="672" font-size="26" font-weight="400" fill="#2563EB" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">proposed basket</text>
<rect x="400" y="870" width="1120" height="120" rx="12" fill="#FFFFFF" stroke="#1A1D21" stroke-width="1.5" filter="url(#sh)"/>
<text x="960.0" y="918" font-size="30" font-weight="700" fill="#1A1D21" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">The analyst brings them together —</text>
<text x="960.0" y="960.0" font-size="28" font-weight="400" fill="#1A1D21" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">owns the judgment; the server computes the math</text>

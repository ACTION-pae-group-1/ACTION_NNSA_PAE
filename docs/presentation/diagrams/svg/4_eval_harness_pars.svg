<text x="1480.0" y="190.36" font-size="26" font-weight="400" fill="#1A1D21" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">approved endpoints only (Ask Sage -gov / local Ollama)</text>
<text x="60" y="280" font-size="30" font-weight="700" fill="#1A1D21" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif">Question datasets</text>

<text x="88" y="347" font-size="28" font-weight="700" fill="#1A1D21" text-anchor="start" font-family="Consolas, 'Courier New', monospace">pars-eval-0</text>
<text x="88" y="386.6" font-size="26" font-weight="400" fill="#4B5563" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif">25 questions · frozen</text>

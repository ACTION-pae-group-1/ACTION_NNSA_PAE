<text x="1436.0" y="432.36" font-size="26" font-weight="400" fill="#1A1D21" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">WBS hierarchy · synthetic DuckDB</text>
<path d="M 1060 380 L 1180 380" fill="none" stroke="#4B5563" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="1079.5" y="337.3" width="81.0" height="33.800000000000004" rx="6" fill="#F7F8FA" stroke="none"/>
<text x="1120" y="362" font-size="26" font-weight="400" fill="#4B5563" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">stdio</text>
<rect x="1180" y="540" width="680" height="250" rx="12" fill="#FFFFFF" stroke="#1A1D21" stroke-width="1.5" filter="url(#sh)"/>
<text x="1208" y="590" font-size="32" font-weight="700" fill="#1A1D21" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif">LLM judges</text>
<text x="1208" y="640" font-size="26" font-weight="700" fill="#1A1D21" text-anchor="start" font-family="Consolas, 'Courier New', monospace">match_expected_response</text>
<text x="1208" y="674" font-size="26" font-weight="400" fill="#4B5563" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif">→ correct / incorrect</text>
<text x="1208" y="718" font-size="26" font-weight="700" fill="#1A1D21" text-anchor="start" font-family="Consolas, 'Courier New', monospace">check_answer_scope</text>
<text x="1208" y="752" font-size="26" font-weight="400" fill="#4B5563" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif">→ within / out of scope</text>
<text x="1840" y="590" font-size="24" font-weight="400" fill="#4B5563" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif">temperature 0</text>
<path d="M 1060 520 L 1120 520 L 1120 660 L 1180 660" fill="none" stroke="#4B5563" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="1066.5" y="587.3" width="107.0" height="33.800000000000004" rx="6" fill="#F7F8FA" stroke="none"/>
<text x="1120" y="612" font-size="26" font-weight="400" fill="#4B5563" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">answers</text>
<rect x="60" y="620" width="440" height="170" rx="12" fill="#FDF3E7" stroke="#B45309" stroke-width="2"/>
<text x="84" y="662" font-size="26" font-weight="400" fill="#B45309" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif">Reported 2026-11-11:</text>
<text x="84" y="695" font-size="26" font-weight="400" fill="#B45309" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif">100% correctness + scope,</text>
<text x="84" y="728" font-size="26" font-weight="400" fill="#B45309" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif">50/50 (25 Q × 2 prompts)</text>
<text x="84" y="761" font-size="26" font-weight="400" fill="#B45309" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif">run output not in the repo</text>
<rect x="60" y="840" width="1800" height="110" rx="12" fill="#EEF0F3" stroke="none"/>
<text x="90" y="906" font-size="30" font-weight="700" fill="#1A1D21" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif">Tracing</text>
<path d="M 220 896 L 268 896" fill="none" stroke="#4B5563" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="280" y="873" width="378.0" height="46" rx="23.0" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="469.0" y="905.36" font-size="26" font-weight="400" fill="#1A1D21" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">Phoenix UI · loopback only</text>
<text x="688.0" y="905" font-size="26" font-weight="400" fill="#4B5563" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif">or</text>
<rect x="738.0" y="873" width="222.0" height="46" rx="23.0" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="849.0" y="905.36" font-size="26" font-weight="400" fill="#1A1D21" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">JSONL fallback</text>
<text x="1120" y="885.0" font-size="26" font-weight="400" fill="#4B5563" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif">every agent and judge call is traced;</text>
<text x="1120" y="919.32" font-size="26" font-weight="400" fill="#4B5563" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif">nothing leaves the loopback</text>
<text x="80" y="1056" font-size="24" font-weight="400" fill="#4B5563" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif">Corrected vs. prompt 4: verdict shown as reported, not verified (no run output in the repo) · the server now has 16 tools</text>
</svg>

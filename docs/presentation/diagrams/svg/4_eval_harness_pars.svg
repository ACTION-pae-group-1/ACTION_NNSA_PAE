<text x="588" y="383.2" font-size="26" font-weight="400" fill="#4B5563" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif">portable MCPAgent + MCPHub</text>
<text x="588" y="417.52" font-size="26" font-weight="400" fill="#4B5563" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif">no LangChain (a test enforces it)</text>

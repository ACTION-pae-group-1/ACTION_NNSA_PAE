[project]
name = "bls_mcp"
version = "0.1.0"
description = "Starter MCP server for the GSA MCP hackathon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.10,<4",
    "duckdb>=1.4,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.0,<3",
    "pytz>=2026.6",
    "polars==1.39.3",
    "scikit-learn==1.4.2",
    "scipy==1.12.0",
    "hiclass==4.13.3",
    "scikit-multilearn==0.2.0",
    "tqdm-joblib==0.0.5",
    "numpy==1.26.4",
    "joblib==1.5.3",
    "openpyxl>=3.1.5",
    "faker>=20",
    "pyright>=1.1.414",
    "arize-phoenix>=20.6.0",
    "pip-system-certs>=5.3 ; sys_platform == 'win32'",
]

[project.scripts]
example-server = "bls_mcp.app:main"
bls-server = "bls_mcp.app:main"
bls-smoke = "bls_mcp.smoke:main"
bls-data = "bls_mcp.ingestion.cli:main"
pars-mcp-server = "pars_local_mcp.mcp.server:main"

[project.optional-dependencies]
phoenix-tracing = [
    "arize-phoenix-otel>=0.17.3",
    "openinference-instrumentation>=0.1.77",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bls_mcp", "src/pars_local_mcp"]

[dependency-groups]
apps = [
    "prefab-ui==0.21.1",
]
dev = [
    "mypy>=1.11,<2",
    "poethepoet>=0.48,<1",
    "pre-commit>=4.7.0",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=5,<7",
    "ruff>=0.16.10",
    "uv>=0.3.0",
    "portable-llm-mcp",
    "httpx2>=2.16.0",
    # Evaluation harness dependencies (no langchain — the portable agent is
    # the only client; eval/phoenix/tests/test_approved_imports.py enforces it)
    "arize-phoenix-client>=2.13.0",
    "arize-phoenix-evals>=3.1.1",
    "opentelemetry-exporter-otlp>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
    "boto3-stubs>=1.44.4",
]
ui = [
    "streamlit==1.67.0",
]

[tool.mypy]
exclude = [
    '(^|[\\/])tests[\\/]',
    '(^|[\\/])test_.*\.py$',
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", ".agents", "docs/vendor"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "src/bls_mcp/tests",
    "src/portable_llm_mcp/tests",
    "src/cost_intel_ui/tests",
    "src/pars_local_mcp/tests",
    "src/cost_intel_app/tests",
    "eval/asksage/tests",
]
pythonpath = ["src"]
addopts = "-m 'not live and not slow' -p no:anyio -p no:phoenix --import-mode=importlib"
markers = [
    "live: tests that may access the live BLS service (explicit opt-in only)",
    "slow: model training, tuning, and expensive WBS pipeline tests",
]
[tool.poe.tasks]
launch = { cmd = "bls-server", help = "Launch the BLS MCP stdio server" }
mcp-check = { cmd = "python src/portable_llm_mcp/examples/check_mcp.py", help = "Check local MCP tool discovery" }
agent = { cmd = "python src/portable_llm_mcp/examples/run_agent.py", help = "Run the portable LLM agent; pass a quoted prompt" }
smoke = { cmd = "python -m bls_mcp.smoke", help = "Check a running HTTP MCP server without Node.js or live BLS requests" }
eval-selftest = { cmd = "python -m eval.bls.runner --selftest", help = "Run the conversation evals with scripted agents (no model, no network)" }
eval = { cmd = "python -m eval.bls.runner --agent model", help = "Run the conversation evals against the model configured by LLM_* variables" }
eval-report = { cmd = "python -m eval.bls.report", help = "List recorded eval runs; pass --run ID or --compare A B" }
eval-history = { cmd = "python -m eval.bls.history", help = "Show longitudinal BLS eval scores; use --format csv --output PATH to export" }
verify = { cmd = "python -m bls_mcp.smoke --in-process", help = "Start the server in-process from .env and check tools, resources, and the snapshot (no network)" }
serve = { cmd = "python -m bls_mcp.app", help = "Launch the MCP server using local .env configuration" }
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
test = "python -m pytest --ignore=src/pars_local_mcp/mcp/test_wbs_tools.py"
test-live = "pytest -m live"
test-cov = "pytest --cov=bls_mcp --cov-report=term-missing"
typecheck = "mypy src/bls_mcp src/portable_llm_mcp"
pyright-check = { cmd = "pyright --project pyrightconfig.json", help = "Check BLS evaluation typing and unresolved references" }
manifest-check = { cmd = "python scripts/check_manifest_hashes.py", help = "Check that checksum-pinned data files match their manifests, using the bytes Git stores" }
manifest-fix = { cmd = "python scripts/check_manifest_hashes.py --fix", help = "Rewrite manifest sha256 and size_bytes from the bytes Git stores, then re-check" }
check = { cmd = "python scripts/run_checks.py", help = "Run lint, formatting, types, pinned-file hashes, and tests with actionable failure messages" }
export-requirements = "uv export --locked --no-dev --no-emit-project --no-hashes --output-file requirements.txt"

[tool.poe.tasks.sample-snapshot]
help = "Build, validate, publish, and activate the offline sample DuckDB snapshot (no network)"
sequence = [
    { cmd = "bls-data build --candidate data/local/build-sample.duckdb --snapshot-id sample_pc_ci --pc-manifest src/bls_mcp/docs/sample_data/pc-sample-input.json --ci-manifest src/bls_mcp/docs/sample_data/ci-sample-input.json" },
    { cmd = "bls-data validate --candidate data/local/build-sample.duckdb --pc-manifest src/bls_mcp/docs/sample_data/pc-sample-input.json --ci-manifest src/bls_mcp/docs/sample_data/ci-sample-input.json" },
    { cmd = "bls-data publish --candidate data/local/build-sample.duckdb --registry-dir data/local/snapshots" },
    { cmd = "bls-data activate --registry-dir data/local/snapshots --snapshot-id sample_pc_ci" },
    { cmd = "bls-data current --registry-dir data/local/snapshots" },
]

[tool.uv.workspace]
members = [
    "src/portable_llm_mcp",
]

[tool.uv]
# The default test paths import prefab_ui (apps) and streamlit (ui), so a plain
# `uv sync` installs those groups as well as dev.
default-groups = ["dev", "apps", "ui"]
# numpy is pinned to 1.26.4 by the WBS source (the parity golden depends on it).
# pyarrow 26 requires numpy 2, and streamlit pulls pyarrow in, so cap it at 25.x.
# Revisit when numpy is upgraded and the parity golden is regenerated.
constraint-dependencies = ["pyarrow<26"]

[tool.uv.sources]
portable-llm-mcp = { workspace = true, editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-llm-mcp"
version = "0.1.0"
description = "Provider-neutral Python LLM client and MCP tool runner"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.9,<2",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.35,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.setuptools]
packages = ["portable_llm_mcp"]

[tool.setuptools.package-dir]
portable_llm_mcp = "."

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:phoenix"

[tool.ruff]
line-length = 88
target-version = "py311"
